name: Deploy site to GitHub Pages

# 只在「完整 CI」跑绿之后才部署。
#
# 以前是 push 触发 + 自己再跑一遍 check_all.py --quick —— 而 --quick 会跳过
# 516 项 jsdom 回归，于是回归挂了也照样发布。门禁看起来有两道，其实各跑各的：
# CI 红着，Pages 绿着（2026-11-12 就是这样，网页版停在 11-09 的旧构建）。
#
# 现在改成 workflow_run：上游 CI 完成的瞬间才被唤醒，conclusion 不是 success
# 就整条链停在 gate 里，不发版。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    name: 等完整 CI 通过
    # CI 失败 / 取消 → 不部署。手动触发时没有上游事件，直接放行。
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 记录将要部署的提交
        run: |
          echo "deploy sha = ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "upstream conclusion = ${{ github.event.workflow_run.conclusion || 'workflow_dispatch' }}"

  deploy:
    needs: gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 里 github.sha 是默认分支的最新提交，不一定是 CI 跑过的那次，
          # 必须显式取上游 head_sha，否则可能部署一个没被 CI 验证过的提交。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 网页版唯一的缓存刷新机制：Service Worker 的 VERSION 必须每次部署都变。
      # 否则老访客的 SW 会一直返回旧缓存（Pages 不支持自定义 Cache-Control）。
      # 用 commit sha 而不用时间戳：同一次提交重复部署不会让所有人重新下载 4.5 MB。
      - name: Stamp Service Worker version
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          VER="v$(echo "$SHA" | cut -c1-8)"
          sed -i "s/^const VERSION = '.*';/const VERSION = '$VER';/" site/sw.js
          echo "sw.js VERSION -> $VER"
          grep -m1 "const VERSION" site/sw.js

      # 网页版首屏瘦身（2026-11-14）
      # Pages 直发源码，而 APK 侧 build.sh 早就在打包时压过了（app.js 431→289 KB）。
      # 这里只压 assets/ 与 data/ 下的 .js，实测体积 -40%，文件名不变，
      # 所以 <script src> 与 sw.js 的预缓存清单都不用改。
      # 压完逐个 node --check：压缩器出错时宁可发未压缩，也不能发坏文件。
      - name: Minify JS for the web build
        run: |
          npm i -g terser@5 --silent
          n=0; before_all=0; after_all=0
          for f in site/assets/*.js site/data/*.js; do
            [ -f "$f" ] || continue
            b=$(stat -c%s "$f"); before_all=$((before_all+b))
            if terser "$f" -c passes=2 -m -f comments=false -o "$f.tmp" 2>/dev/null; then
              a=$(stat -c%s "$f.tmp")
              if [ "$a" -lt "$b" ]; then mv "$f.tmp" "$f"; n=$((n+1)); after_all=$((after_all+a)); else rm -f "$f.tmp"; after_all=$((after_all+b)); fi
            else
              rm -f "$f.tmp"; after_all=$((after_all+b)); echo "⚠ 跳过（terser 解析失败）: $f"
            fi
          done
          for f in site/assets/*.js site/data/*.js; do node --check "$f" || { echo "✗ 压缩产物语法错误: $f"; exit 1; }; done
          echo "压缩 $n 个文件：$((before_all/1024)) KB → $((after_all/1024)) KB（-$(( 100 - after_all*100/before_all ))%）"

      # 压缩产物必须自己验一遍：仓库里的测试跑在未压缩源码上，
      # 压缩这一步过去没有任何守门员（terser 出错 = 线上坏文件 + CI 全绿）。
      - name: 压缩产物装载检查
        run: |
          npm i jsdom --silent
          node site/tools/verify_minified.js site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
