name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 部署前先过一遍门禁：数据/代码/版本/预缓存清单。
  # 以前是「推上去就直接发布」，一个坏掉的数据文件能直接上线。
  checks:
    name: 部署前校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装校验依赖
        run: cd site/tools && npm i --no-audit --no-fund
      - name: 门禁
        run: python3 site/tools/check_all.py --quick

  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 网页版唯一的缓存刷新机制：Service Worker 的 VERSION 必须每次部署都变。
      # 否则老访客的 SW 会一直返回旧缓存，改了也看不到（Pages 不支持自定义 Cache-Control）。
      # 用 commit sha 而不用时间戳：同一次提交重复部署不会让所有人重新下载 4.5 MB。
      - name: Stamp Service Worker version
        run: |
          VER="v${GITHUB_SHA::8}"
          sed -i "s/^const VERSION = '.*';/const VERSION = '$VER';/" site/sw.js
          echo "sw.js VERSION -> $VER"
          grep -m1 "const VERSION" site/sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
