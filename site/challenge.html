<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#170303">
<title>闯关 · 学通</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#170303; --fg:#e8e8ea; --gold:#f5c518; --line:rgba(255,255,255,.10);
  --card:linear-gradient(160deg,#2b0505,#1b0404);
}
@media (prefers-color-scheme:light){
  :root{ --bg:#f6f2ea; --fg:#2a2118; --gold:#b8860b; --line:rgba(0,0,0,.10);
    --card:linear-gradient(160deg,#fffdf8,#f3ece0); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;line-height:1.6}
body{padding:calc(8px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px))}

/* 顶栏 */
#bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#bar .btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--fg);
  border-radius:999px;padding:6px 13px;font-size:.82rem;font-family:inherit;cursor:pointer}
#bar .t{font-weight:700;font-size:1rem;letter-spacing:.5px}
#bar .sp{flex:1}
#bar .gold{color:var(--gold);border-color:rgba(245,197,24,.45)}
.impwrap{position:relative;overflow:hidden;display:inline-block}
.impwrap input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}

/* 包列表 */
#list{display:flex;flex-direction:column;gap:10px}
.pack{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;
  border-radius:14px;border:1px solid rgba(245,197,24,.22);background:var(--card);
  box-shadow:0 6px 22px rgba(0,0,0,.25);font-family:inherit;color:inherit;cursor:pointer}
.pack:active{transform:scale(.995)}
.pack .ic{font-size:1.9rem;line-height:1;flex:none}
.pack .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.pack .mid b{font-size:1rem}
.pack .mid i{font-style:normal;font-size:.72rem;color:var(--gold);opacity:.85;margin-top:2px}
.pack .mid u{text-decoration:none;font-size:.74rem;opacity:.6;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pack .st{flex:none;font-size:.76rem;color:var(--gold);background:rgba(245,197,24,.12);
  border-radius:999px;padding:3px 9px}
.pack .del{flex:none;background:none;border:0;color:rgba(255,255,255,.35);font-size:1.1rem;
  padding:4px 2px;cursor:pointer}

/* 空状态 */
.emptybox{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  padding:0 28px;z-index:10}
.emptybox .e1{font-size:2.6rem}
.emptybox .e2{font-size:.92rem;margin-top:10px;opacity:.85}
.emptybox .e3{font-size:.78rem;margin-top:8px;opacity:.55;line-height:1.8}

/* 全屏容器：包在这里跑，App 不参与任何绘制 */
#player{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:var(--bg);display:none;
  flex-direction:column}
#player.on{display:flex}
#pbar{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;
  background:var(--bg);border-bottom:1px solid var(--line);flex:none}
#pbar .btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--fg);
  border-radius:999px;padding:5px 12px;font-size:.78rem;font-family:inherit;cursor:pointer}
#pbar .pn{font-size:.82rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
#game{flex:1;width:100%;border:0;background:var(--bg);display:block}

/* 载入遮罩（兜底：脚本出错也自己消失） */
#loading{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;
  justify-content:center;background:var(--bg);font-size:.86rem;opacity:.8;
  animation:ldone 0s linear 6s forwards}
@keyframes ldone{to{opacity:0;visibility:hidden;pointer-events:none}}
#loading.off{display:none}

/* 错误条 */
#errbar{position:fixed;left:0;right:0;top:0;z-index:60;background:#5a1010;color:#fff;
  font-size:.74rem;line-height:1.6;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;
  display:none;white-space:pre-wrap;word-break:break-all}
#errbar.on{display:block}

/* 提示条 */
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(20px);z-index:70;background:rgba(0,0,0,.82);color:#fff;
  font-size:.78rem;padding:9px 16px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;
  max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<script src="assets/custom.js"></script><script src="assets/crash.js"></script><script src="assets/diag.js"></script>
</head>
<body>

<div id="bar">
  <button class="btn" onclick="location.href='index.html'">‹ 返回</button>
  <span class="t">🎮 闯关</span>
  <span class="sp"></span>
  <span class="btn gold impwrap">＋ 导入包
    <input type="file" id="picker" accept=".html,.htm,text/html,application/octet-stream,document/*">
  </span>
</div>

<div id="list"></div>

<div id="player">
  <div id="pbar">
    <button class="btn" id="pBack">‹ 退出</button>
    <span class="pn" id="pName"></span>
    <button class="btn" id="pReload" title="重新载入">↻</button>
  </div>
  <!-- 允许 same-origin：包要用 localStorage 自己存档。
       代价是包能读到本机数据（书库/导入记录），导入前会提示只装可信来源。
       包没有任何网络能力（App 无 INTERNET 权限），数据出不去。 -->
  <iframe id="game" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock"
          referrerpolicy="no-referrer" title="关卡内容"></iframe>
</div>

<div id="loading">正在载入…</div>
<div id="errbar"></div>
<div id="toast"></div>

<script src="assets/challenge.js"></script>
</body>
</html>
