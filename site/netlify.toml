# Netlify 部署配置（纯静态，无需构建）
[build]
  publish = "."

# 说明（2026-10 整改）：
# · 根目录下的 404.html 会被 Netlify「自动托管」为 404 页，无需再写
#   /* → /404.html 的重定向；原来那条重定向是多余的，且可能遮挡静态文件
#   （已导致线上 /version.json 等文件被 404 拦截），故删除。
# · 若将来要做 SPA 前端路由回退，启用下面这段（注意别把真实文件也吞掉）：
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
